name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --workspace

      # UTBH berjalan sebagai guest tool — di CI ini dijalankan langsung di
      # runner (bukan VM) sebagai smoke test harness-nya sendiri.
      - name: Smoke — discover
        run: ./target/release/utbh discover

      - name: Smoke — list
        run: ./target/release/utbh list

      - name: Smoke — CI profile
        run: ./target/release/utbh --profile configs/ci.json run

      - name: Smoke — fuzz
        run: ./target/release/utbh fuzz cpu --seed 1 --iterations 16

  # UTBH bersifat guest-side dan didukung di tiga target: x86_64, aarch64,
  # dan riscv64 (ISA guest mivon emu). Semua wajib type-check.
  cross-isa:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check workspace for ${{ matrix.target }}
        run: cargo check --workspace --target ${{ matrix.target }}

  # Artefak release per target. RISC-V wajib (guest mivon emu); x86_64 dan
  # aarch64 adalah target rilis resmi yang juga diuji.
  release:
    name: release ${{ matrix.target }}
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross linker
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu

      - name: Build release for ${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          elif [ "${{ matrix.target }}" = "riscv64gc-unknown-linux-gnu" ]; then
            export CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc
          fi
          cargo build --release --workspace --target "${{ matrix.target }}"

      - name: Upload utbh binary
        uses: actions/upload-artifact@v4
        with:
          name: utbh-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/utbh
          if-no-files-found: error
