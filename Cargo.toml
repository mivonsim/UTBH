[workspace]
resolver = "2"
members = [
    "crates/utbh-core",
    "crates/utbh-api",
    "crates/utbh-discovery",
    "crates/utbh-workload",
    "crates/utbh-validation",
    "crates/utbh-test",
    "crates/utbh-benchmark",
    "crates/utbh-fuzz",
    "crates/utbh-trace",
    "crates/utbh-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
utbh-core = { path = "crates/utbh-core" }
utbh-api = { path = "crates/utbh-api" }
utbh-discovery = { path = "crates/utbh-discovery" }
utbh-workload = { path = "crates/utbh-workload" }
utbh-validation = { path = "crates/utbh-validation" }
utbh-test = { path = "crates/utbh-test" }
utbh-benchmark = { path = "crates/utbh-benchmark" }
utbh-fuzz = { path = "crates/utbh-fuzz" }
utbh-trace = { path = "crates/utbh-trace" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
